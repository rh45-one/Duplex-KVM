[workspace]
resolver = "2"
members = [
    "crates/duplex-proto",
    "crates/duplex-pal",
    "crates/duplex-guard",
    "crates/duplexd",
    "crates/duplex-ctl",
    "crates/duplex-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Duplex Systems Engineering"]
repository = "https://github.com/duplex-kvm/duplex-kvm"

[workspace.dependencies]
duplex-proto = { path = "crates/duplex-proto" }
duplex-pal = { path = "crates/duplex-pal" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chacha20poly1305 = "0.10"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
