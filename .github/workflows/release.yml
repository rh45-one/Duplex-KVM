name: Release Duplex-KVM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK+ 3 & pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin duplex-kvm

      - name: Stage Linux binary
        run: |
          mkdir -p dist
          cp target/release/duplex-kvm dist/duplex-kvm-linux-x86_64
          chmod +x dist/duplex-kvm-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplex-kvm-linux-x86_64
          path: dist/duplex-kvm-linux-x86_64

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin duplex-kvm

      - name: Stage Windows binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/duplex-kvm.exe dist/duplex-kvm-windows-x86_64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplex-kvm-windows-x86_64.exe
          path: dist/duplex-kvm-windows-x86_64.exe

  publish-release:
    name: Publish Release (Private Repository)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: duplex-kvm-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: duplex-kvm-windows-x86_64.exe
          path: dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          chmod +x duplex-kvm-linux-x86_64
          sha256sum duplex-kvm-linux-x86_64 duplex-kvm-windows-x86_64.exe > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing release $TAG in private repository..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading/updating assets..."
            gh release upload "$TAG" \
              dist/duplex-kvm-linux-x86_64 \
              dist/duplex-kvm-windows-x86_64.exe \
              dist/SHA256SUMS.txt \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              dist/duplex-kvm-linux-x86_64 \
              dist/duplex-kvm-windows-x86_64.exe \
              dist/SHA256SUMS.txt \
              --title "Duplex-KVM $TAG" \
              --generate-notes
          fi
