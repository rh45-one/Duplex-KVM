[package]
name = "duplex-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "duplex-kvm"
path = "src/main.rs"

[dependencies]
duplex-proto = { workspace = true }
duplex-pal = { workspace = true }
duplex-guard = { path = "../duplex-guard" }
duplexd = { path = "../duplexd" }
serde = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
